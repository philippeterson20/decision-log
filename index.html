<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decision Log</title>
<style>
  :root {
    --bg: #fafaf9;
    --card: #ffffff;
    --border: #e7e5e4;
    --text: #1c1917;
    --muted: #78716c;
    --accent: #292524;
    --blue: #2563eb;
    --blue-light: #eff6ff;
    --red: #dc2626;
    --green: #16a34a;
    --green-light: #f0fdf4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 32px 24px;
    max-width: 480px;
    margin: 0 auto;
  }
  .header {
    margin-bottom: 40px;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--accent);
  }
  .header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .header .subtitle { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .card label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 8px;
    margin-top: 16px;
  }
  .card label:first-child { margin-top: 0; }
  input[type="text"] {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  .count-pills { display: flex; gap: 8px; margin-bottom: 4px; }
  .count-pill {
    width: 44px;
    height: 44px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    background: var(--card);
  }
  .count-pill:hover { border-color: var(--accent); }
  .count-pill.selected { background: var(--accent); color: white; border-color: var(--accent); }
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 16px;
    transition: opacity 0.15s;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { opacity: 0.85; }
  .or-divider {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin: 8px 0 24px;
    position: relative;
  }
  .or-divider::before, .or-divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 44%;
    height: 1px;
    background: var(--border);
  }
  .or-divider::before { left: 0; }
  .or-divider::after { right: 0; }
  /* Session created view */
  .big-code {
    font-size: 48px;
    font-weight: 700;
    letter-spacing: 6px;
    text-align: center;
    padding: 24px;
    background: var(--card);
    border: 2px solid var(--accent);
    border-radius: 12px;
    margin-bottom: 12px;
  }
  .copy-link-btn {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    background: var(--card);
    color: var(--blue);
    font-weight: 500;
    margin-bottom: 24px;
    transition: background 0.15s;
  }
  .copy-link-btn:hover { background: var(--blue-light); }
  .copy-link-btn.copied { color: var(--green); background: var(--green-light); border-color: var(--green); }
  .hint {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .error-msg {
    font-size: 13px;
    color: var(--red);
    margin-top: 8px;
    display: none;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Decision Log</h1>
  <div class="subtitle">Blind multiplayer decision recording.</div>
</div>

<!-- Create view (default) -->
<div id="createView">
  <div class="section-label">Create a Session</div>
  <div class="card">
    <label>Number of participants</label>
    <div class="count-pills">
      <div class="count-pill selected" onclick="selectCount(this, 2)">2</div>
      <div class="count-pill" onclick="selectCount(this, 3)">3</div>
      <div class="count-pill" onclick="selectCount(this, 4)">4</div>
      <div class="count-pill" onclick="selectCount(this, 5)">5</div>
    </div>
    <div class="error-msg" id="createError"></div>
    <button class="btn btn-primary" onclick="createSession()">Create Session</button>
  </div>

  <div class="or-divider">or</div>

  <div class="section-label">Join a Session</div>
  <div class="card">
    <label>Session code</label>
    <input type="text" id="joinCode" placeholder="e.g. K7X2M9" maxlength="6" style="text-transform:uppercase; letter-spacing: 3px; font-weight:700; font-size:18px;">
    <label>Your name</label>
    <input type="text" id="joinName" placeholder="e.g. Alex">
    <div class="error-msg" id="joinError"></div>
    <button class="btn btn-primary" onclick="joinSession()">Join Session</button>
  </div>
</div>

<!-- Session created view -->
<div id="sessionView" style="display:none">
  <div class="section-label">Session Created</div>
  <div class="big-code" id="sessionCodeDisplay"></div>
  <p class="hint">Share this code or link with your team.<br>Everyone fills out their form independently.</p>
  <button class="copy-link-btn" id="copyBtn" onclick="copyLink()">Copy join link</button>

  <div class="section-label">Join as first participant</div>
  <div class="card">
    <label>Your name</label>
    <input type="text" id="hostName" placeholder="e.g. Alex">
    <div class="error-msg" id="hostError"></div>
    <button class="btn btn-primary" onclick="joinAsHost()">Join & fill form</button>
  </div>
</div>

<!-- Direct join view (?join=CODE) -->
<div id="joinView" style="display:none">
  <div class="section-label">Join Session</div>
  <div class="big-code" id="joinCodeDisplay"></div>
  <div class="card">
    <label>Your name</label>
    <input type="text" id="joinNameDirect" placeholder="e.g. Alex">
    <div class="error-msg" id="directJoinError"></div>
    <button class="btn btn-primary" onclick="joinDirect()">Join & fill form</button>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let participantCount = 2;
  let createdSessionId = null;

  const params = new URLSearchParams(location.search);
  const joinCode = params.get('join');

  if (joinCode) {
    document.getElementById('createView').style.display = 'none';
    document.getElementById('joinView').style.display = 'block';
    document.getElementById('joinCodeDisplay').textContent = joinCode.toUpperCase();
  }

  function selectCount(el, n) {
    document.querySelectorAll('.count-pill').forEach(p => p.classList.remove('selected'));
    el.classList.add('selected');
    participantCount = n;
  }

  function generateCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    return Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
  }

  async function createSession() {
    const btn = event.currentTarget;
    btn.disabled = true;
    btn.textContent = 'Creating...';
    const errEl = document.getElementById('createError');
    errEl.style.display = 'none';

    const id = generateCode();
    const { error } = await db.from('sessions').insert({ id, expected_count: participantCount });

    if (error) {
      errEl.textContent = 'Error: ' + error.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Create Session';
      return;
    }

    createdSessionId = id;
    document.getElementById('createView').style.display = 'none';
    document.getElementById('sessionView').style.display = 'block';
    document.getElementById('sessionCodeDisplay').textContent = id;
  }

  function copyLink() {
    const link = location.origin + location.pathname + '?join=' + createdSessionId;
    navigator.clipboard.writeText(link).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Copy join link';
        btn.classList.remove('copied');
      }, 2000);
    });
  }

  function joinAsHost() {
    const name = document.getElementById('hostName').value.trim();
    const errEl = document.getElementById('hostError');
    if (!name) { errEl.textContent = 'Enter your name'; errEl.style.display = 'block'; return; }
    location.href = `form.html?session=${createdSessionId}&name=${encodeURIComponent(name)}`;
  }

  function joinDirect() {
    const name = document.getElementById('joinNameDirect').value.trim();
    const errEl = document.getElementById('directJoinError');
    if (!name) { errEl.textContent = 'Enter your name'; errEl.style.display = 'block'; return; }
    location.href = `form.html?session=${joinCode.toUpperCase()}&name=${encodeURIComponent(name)}`;
  }

  function joinSession() {
    const code = document.getElementById('joinCode').value.trim().toUpperCase();
    const name = document.getElementById('joinName').value.trim();
    const errEl = document.getElementById('joinError');
    if (!code || code.length < 6) { errEl.textContent = 'Enter a valid 6-character session code'; errEl.style.display = 'block'; return; }
    if (!name) { errEl.textContent = 'Enter your name'; errEl.style.display = 'block'; return; }
    location.href = `form.html?session=${code}&name=${encodeURIComponent(name)}`;
  }
</script>
</body>
</html>
